kind: Connector
version: v2
definition:
  name: logic
  subgraph: app
  source: hasura/nodejs:v1.13.0
  context: .
  envMapping:
    AUTH_JWKS_URI:
      fromEnv: APP_LOGIC_AUTH_JWKS_URI
    CONSOLE_HOST:
      fromEnv: APP_LOGIC_CONSOLE_HOST
    CONTROL_PLANE_URL:
      fromEnv: APP_LOGIC_CONTROL_PLANE_URL
    DDN_ACCESS_TOKEN:
      fromEnv: APP_LOGIC_DDN_ACCESS_TOKEN
    HASURA_CONNECTOR_PORT:
      fromEnv: APP_LOGIC_HASURA_CONNECTOR_PORT
    HASURA_SERVICE_TOKEN_SECRET:
      fromEnv: APP_LOGIC_HASURA_SERVICE_TOKEN_SECRET
    OTEL_EXPORTER_OTLP_ENDPOINT:
      fromEnv: APP_LOGIC_OTEL_EXPORTER_OTLP_ENDPOINT
    OTEL_SERVICE_NAME:
      fromEnv: APP_LOGIC_OTEL_SERVICE_NAME
    PROMPTQL_PLAYGROUND_URL:
      fromEnv: APP_LOGIC_PROMPTQL_PLAYGROUND_URL
    SLACK_BOT_TOKEN:
      fromEnv: APP_LOGIC_SLACK_BOT_TOKEN
