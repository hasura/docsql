services:
  promptql-proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PROMPTQL_API_KEY=${PROMPTQL_API_KEY}
      - PROMPTQL_API_ENDPOINT=${PROMPTQL_API_ENDPOINT}
      - PROMPTQL_API_HOST=${PROMPTQL_API_HOST}
      - PUBLIC_JWT=${PUBLIC_JWT}
    volumes:
      - ./logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
